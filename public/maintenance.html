<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程地圖維護中</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* 加上淡淡的網格背景增加科技感 */
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        .container {
            background: var(--card-bg);
            padding: 3rem 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 480px;
            width: 90%;
            /* 頂部加上警示顏色的飾條 */
            border-top: 6px solid #f59e0b;
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon {
            font-size: 4.5rem;
            margin-bottom: 1rem;
            display: inline-block;
            /* 加上輕微的上下浮動動畫 */
            animation: bounce 2.5s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        h1 {
            color: var(--text-main);
            font-size: 1.5rem;
            margin: 0 0 1rem 0;
            font-weight: 700;
            letter-spacing: 1px;
        }
        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .link-card {
            background: #f1f5f9;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
        }
        .link-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 1rem;
            display: block;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 0.8rem;
        }
        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .raw-url {
            font-size: 0.8rem;
            color: var(--text-muted);
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>=== 課程地圖維護中 ===</h1>
        <p>系統目前正在進行更新與優化作業。<br>如有問題請聯絡科管院學士班系辦</p>
        
        
        <div class="link-card">
            <span class="link-title">請使用以下替代網址繼續瀏覽：</span>
            <a href="https://ipmt-curriculum-map.vercel.app/" class="btn">前往替代網站</a>
            <div class="raw-url">https://ipmt-curriculum-map.vercel.app/</div>
        </div>
    </div>
</body>
</html>
